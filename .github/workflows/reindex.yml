
name: Hourly Sitemap and Reindexing

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-horizons-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify source files
        shell: bash
        run: |
          test -f urls.txt || {
            echo "ERROR: urls.txt is missing"
            exit 1
          }

          test -f public/_redirects || {
            echo "ERROR: public/_redirects is missing"
            exit 1
          }

      - name: Generate sitemap
        run: node build-sitemap.js

      - name: Validate deployment output
        shell: bash
        run: |
          test -s public/sitemap.xml
          test -s public/_redirects
          test -s public/22f83cabcaef4a4891b36c3cb039dcf6.txt

          grep -q '<lastmod>' public/sitemap.xml
          grep -q '<changefreq>hourly</changefreq>' public/sitemap.xml

          echo "Sitemap and redirects validation passed."

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name=binary-horizons --branch=main

      - name: Submit URLs to IndexNow
        if: success()
        run: node ping-indexnow.js
